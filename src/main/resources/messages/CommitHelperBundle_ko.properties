settings.guide.html=<h3>3단계 설정</h3><ol><li><b>General</b>: 출력 언어를 선택합니다. 사용자 지정 템플릿을 사용하면 "저장소 커밋 템플릿 사용"을 끕니다.</li><li><b>LLM</b>: 공급자를 선택하고 Base URL, 모델, API 키를 입력한 뒤 연결 테스트를 실행합니다. 로컬 그룹화만 필요하면 Local only를 선택합니다.</li><li><b>Commit Content</b>: 프롬프트 프로필과 커밋 템플릿을 만들거나 선택하고 둘 다 기본값으로 설정합니다. 네 번째 탭에서 프로젝트별로 재정의할 수 있습니다.</li></ol><h3>세 가지 작업</h3><ul><li>커밋 메시지 생성: 로컬 그룹화 + 선택적 LLM 문구.</li><li>컨텍스트와 함께 생성: 위에 issue, 메모, Skip CI를 추가합니다.</li><li>커밋 메시지 서식 지정: 커밋 상자에 이미 있는 텍스트만 다시 정렬하며, 기본적으로 숨겨져 있습니다.</li></ul><h3>프롬프트와 템플릿의 역할</h3><p>프롬프트는 모델이 "무엇을 쓸지"를 결정하고, 템플릿은 메시지 "레이아웃"을 결정합니다. Format template은 {subject}, {items}, {issue}, {skeleton}을 지원하며, Item line은 {type}, {scope}, {scopeRaw}, {text}를 지원합니다.</p><h3>가장 흔한 실수</h3><p>입력란에 필드 레이블을 붙여 넣지 마세요. 두 필드의 정확한 값은 다음과 같습니다:</p><ul><li>Format template: <code>{items}</code></li><li>Item line: <code>{text}</code></li></ul><p>잘못된 예: "Format template:", "Item line:" 레이블이나 {text}를 Format template에 넣는 것. {text}는 Item line에서만 치환되며 레이블은 그대로 출력됩니다.</p><h3>프로젝트와 전역</h3><p>처음 세 탭은 IDE 전역 설정입니다. 네 번째 탭은 선택한 프롬프트/템플릿 id를 .idea/commit-helper.xml에 저장할 뿐이며, 비어 있으면 전역 기본값을 상속합니다.</p><h3>문제 해결</h3><ul><li>메시지가 비어 있음: Format template이 비어 있거나 {items}가 없습니다.</li><li>출력에 {text} 또는 Format template:가 그대로 표시됨: 레이블이나 {text}를 Format template에 잘못 입력했습니다.</li><li>저장소 .gitmessage가 템플릿을 재정의함: General의 "저장소 커밋 템플릿 사용"을 끕니다.</li><li>설정 페이지에 한 줄만 표시됨: 0.2.0+로 업그레이드하세요. 탭은 플러그인이 직접 렌더링합니다.</li></ul><h3>프롬프트와 컨텍스트</h3><p>프롬프트에는 규칙만 작성해도 됩니다. {diff} 또는 {fileList}가 없으면 플러그인이 선택한 파일 목록과 diff를 자동으로 추가하므로 모델이 코드를 볼 수 있습니다.</p>
diagnostics.TEMPLATE_EMPTY=Format template이 비어 있거나 {items}가 없어 생성된 메시지가 비어 있게 됩니다.
diagnostics.TEMPLATE_POLLUTED=Format template에 UI 레이블이나 {text}가 포함되어 있습니다. 이 필드에서는 {subject}/{items}/{issue}/{skeleton}만 치환됩니다. {text}는 Item line에 넣고 레이블은 제거하세요.
diagnostics.ITEM_LINE_EMPTY=Item line이 비어 있어 모든 항목이 빈 줄로 렌더링됩니다.
