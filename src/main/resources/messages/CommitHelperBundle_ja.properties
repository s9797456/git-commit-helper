settings.guide.html=<h3>3 ステップで設定</h3><ol><li><b>General</b>: 出力言語を選択します。カスタムテンプレートを使う場合は「リポジトリのコミットテンプレートを使用」をオフにします。</li><li><b>LLM</b>: プロバイダーを選び、Base URL、モデル、API キーを入力して「接続テスト」を実行します。ローカルでのグループ化だけでよい場合は Local only を選択します。</li><li><b>Commit Content</b>: プロンプトプロファイルとコミットテンプレートを作成または選択し、両方を既定に設定します。4 番目のタブでプロジェクトごとに上書きできます。</li></ol><h3>3 つのアクション</h3><ul><li>コミットメッセージを生成: ローカルでのグループ化 + 任意の LLM による文言。</li><li>コンテキスト付きで生成: 上記に issue、メモ、Skip CI を追加します。</li><li>コミットメッセージを整形: コミットボックス内の既存テキストのみを再整形します。既定では非表示です。</li></ul><h3>プロンプトとテンプレートの役割</h3><p>プロンプトはモデルに「何を書くか」を指示し、テンプレートはメッセージの「レイアウト」を決めます。Format template は {subject}、{items}、{issue}、{skeleton} をサポートし、Item line は {type}、{scope}、{scopeRaw}、{text} をサポートします。</p><h3>最も多い設定ミス</h3><p>入力欄にフィールドラベルを貼り付けないでください。2 つのフィールドの正しい値は次のとおりです:</p><ul><li>Format template: <code>{items}</code></li><li>Item line: <code>{text}</code></li></ul><p>誤った例: 「Format template:」「Item line:」というラベルや {text} を Format template に入れること。{text} は Item line でのみ置換され、ラベルはそのまま出力されます。</p><h3>プロジェクトとグローバル</h3><p>最初の 3 つのタブは IDE 全体の設定です。4 番目のタブは選択したプロンプト/テンプレートの id を .idea/commit-helper.xml に保存するだけで、空の場合はグローバルの既定を継承します。</p><h3>トラブルシューティング</h3><ul><li>メッセージが空: Format template が空か {items} がありません。</li><li>出力に {text} や Format template: がそのまま出る: ラベルや {text} を Format template に誤って入力しています。</li><li>リポジトリの .gitmessage がテンプレートを上書きする: General の「リポジトリのコミットテンプレートを使用」をオフにします。</li><li>設定ページに 1 行しか表示されない: 0.2.0+ にアップグレードしてください。タブはプラグインが自身で描画します。</li></ul>
diagnostics.TEMPLATE_EMPTY=Format template が空か {items} がないため、生成されるメッセージは空になります。
diagnostics.TEMPLATE_POLLUTED=Format template に UI ラベルまたは {text} が含まれています。このフィールドで置換されるのは {subject}/{items}/{issue}/{skeleton} のみです。{text} は Item line に置き、ラベルは削除してください。
diagnostics.ITEM_LINE_EMPTY=Item line が空のため、すべての項目が空行として出力されます。
diagnostics.ITEM_LINE_PREFIX=Item line がリスト記号で始まっているため、カテゴリブロックに接頭辞が重複します。
diagnostics.REPO_TEMPLATE_OVERRIDE=「リポジトリのコミットテンプレートを使用」がオンのため、.gitmessage が選択したテンプレートを上書きします。
diagnostics.PROJECT_PROMPT_MISSING=このプロジェクトが参照するプロンプトプロファイルは存在しないため、グローバル既定値にフォールバックします。
diagnostics.PROJECT_TEMPLATE_MISSING=このプロジェクトが参照するコミットテンプレートは存在しないため、グローバル既定値にフォールバックします。
diagnostics.PROMPT_MISSING_CONTEXT=プロンプトプロファイルに {fileList} または {diff} がないため、モデルは実際の変更を確認できません。
