settings.guide.html=<h3>3 步完成配置</h3><ol><li><b>General</b>：选择输出语言；如果使用自定义模板，关闭“使用仓库提交模板（.gitmessage）”。</li><li><b>LLM</b>：选择提供商，填写 Base URL、模型、API 密钥并点“测试连接”；只用本地分组时可选 Local only。</li><li><b>Commit Content</b>：新建或选择提示词配置与提交模板，并把它们设为默认；项目级可在第 4 个 tab 覆盖。</li></ol><h3>三个动作</h3><ul><li>生成提交信息：本地分组 + 可选 LLM 措辞。</li><li>带上下文生成：在生成基础上附带 issue、备注和 Skip CI。</li><li>格式化提交信息：只重排提交框里已有文本，默认隐藏。</li></ul><h3>提示词与模板的分工</h3><p>提示词决定“让模型写什么”，模板决定“消息怎么排版”。Format template 支持 {subject}、{items}、{issue}、{skeleton}；Item line 支持 {type}、{scope}、{scopeRaw}、{text}。</p><h3>最常见的配置错误</h3><p>不要把字段标签粘进输入框。两个字段的正确值分别是：</p><ul><li>Format template：<code>{items}</code></li><li>Item line：<code>{text}</code></li></ul><p>错误写法：把“Format template:”“Item line:”两个标签或 {text} 放进 Format template。{text} 只在 Item line 里生效，标签会被原样输出。</p><h3>项目级与全局</h3><p>前三个 tab 是 IDE 全局设置；第 4 个 tab 只把选中的提示词/模板 id 写进 .idea/commit-helper.xml，留空表示继承全局默认。</p><h3>排错</h3><ul><li>生成结果为空：Format template 为空或缺少 {items}。</li><li>输出里出现 {text} 或 Format template:：把标签/{text} 误填进了 Format template。</li><li>仓库 .gitmessage 覆盖了模板：关闭 General 里的“使用仓库提交模板”。</li><li>设置页只显示一行：请升级到 0.2.0+，tab 由插件自己渲染。</li></ul>
diagnostics.TEMPLATE_EMPTY=Format template 为空或不含 {items}，生成的提交信息会为空。
diagnostics.TEMPLATE_POLLUTED=Format template 里误填了界面标签或 {text}；该字段只替换 {subject}/{items}/{issue}/{skeleton}，{text} 应放在 Item line。
diagnostics.ITEM_LINE_EMPTY=Item line 为空，所有条目都会渲染成空行。
diagnostics.ITEM_LINE_PREFIX=Item line 以列表符号开头，类别块会重复前缀。
diagnostics.REPO_TEMPLATE_OVERRIDE=已开启“使用仓库提交模板”，.gitmessage 会覆盖所选模板。
diagnostics.PROJECT_PROMPT_MISSING=项目引用的提示词配置已不存在，已回退到全局默认。
diagnostics.PROJECT_TEMPLATE_MISSING=项目引用的提交模板已不存在，已回退到全局默认。
diagnostics.PROMPT_MISSING_CONTEXT=提示词配置缺少 {fileList} 或 {diff}，模型看不到真实变更。
