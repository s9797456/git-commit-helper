settings.guide.html=<h3>3-step setup</h3><ol><li><b>General</b>: choose the output language; if you use a custom template, turn off &quot;Use repository commit template&quot;.</li><li><b>LLM</b>: pick a provider, fill Base URL, Model and API Key, then Test connection. Choose Local only if you just need deterministic grouping.</li><li><b>Commit Content</b>: create or select a Prompt profile and a Commit template, then set both as defaults. The fourth tab overrides them per project.</li></ol><h3>What the three actions do</h3><ul><li>Generate Commit Message: local grouping + optional LLM wording.</li><li>Generate with Context: the same plus issue, notes and Skip CI.</li><li>Format Commit Message: reformat the text already in the commit box; hidden by default.</li></ul><h3>Prompt vs. template</h3><p>The prompt tells the model what to write; the template decides how the message is laid out. Format template supports {subject}, {items}, {issue} and {skeleton}. Item line supports {type}, {scope}, {scopeRaw} and {text}.</p><h3>The most common mistake</h3><p>Do not paste field labels into the inputs. The two fields are exactly:</p><ul><li>Format template: <code>{items}</code></li><li>Item line: <code>{text}</code></li></ul><p>Wrong: putting the Format template:/Item line: labels or {text} into Format template. {text} is only replaced in Item line, and labels are rendered literally.</p><h3>Project vs. global</h3><p>The first three tabs are IDE-wide. The fourth tab only stores the selected prompt/template ids in .idea/commit-helper.xml; empty means inherit the global default.</p><h3>Troubleshooting</h3><ul><li>Empty message: Format template is blank or has no {items}.</li><li>Literal {text} or Format template: in the output: labels or {text} were pasted into Format template.</li><li>Repository .gitmessage overrides your template: turn off General | Use repository commit template.</li><li>Settings page shows only one line: upgrade to 0.2.0+, where the plugin renders the tabs itself.</li></ul>
diagnostics.TEMPLATE_EMPTY=Format template is empty or has no {items}; the generated message will be empty.
diagnostics.TEMPLATE_POLLUTED=Format template contains UI labels or {text}; only {subject}/{items}/{issue}/{skeleton} are replaced there. Put {text} in Item line and remove the labels.
diagnostics.ITEM_LINE_EMPTY=Item line is empty, so every item renders as a blank line.
diagnostics.ITEM_LINE_PREFIX=Item line starts with a list bullet; category blocks will get a duplicated prefix.
diagnostics.REPO_TEMPLATE_OVERRIDE=Use repository commit template is on; .gitmessage overrides the selected template.
diagnostics.PROJECT_PROMPT_MISSING=The project references a prompt profile that no longer exists; it falls back to the global default.
diagnostics.PROJECT_TEMPLATE_MISSING=The project references a commit template that no longer exists; it falls back to the global default.
diagnostics.PROMPT_MISSING_CONTEXT=The prompt profile has no {fileList} or {diff}; the model cannot see the real changes.
