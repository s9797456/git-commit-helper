<!--
  更新说明模板（唯一事实来源：marketplace/change-notes.html）
  ============================================================

  用途：每次发版前，在 change-notes.html 顶部按此模板新增一个小节；同一份内容贴进 PingCode 发版单。

  格式规定（硬性）：

  1. 语言：中文。
  2. 小节结构：<h3>版本号</h3>，下面按需使用 <h4>新增项：</h4> / <h4>优化项：</h4> / <h4>修复项：</h4>。
  3. 空栏整栏省略 —— 没有内容就不写这一栏，不要写"无"。
  4. 条目编号用中文顿号：<p>1、……</p>；不要用 <ol>（渲染成"1."与约定格式不一致）。
  5. 每条必须点明【改动对象】+【可观察结果】。反例（禁止）：
       "优化了体验"、"提升了性能"、"修复了一些问题"、"代码重构"。
     正例：
       "插件发布者信息由 sunpengfei 改为 me-tool：IDE 插件管理器里显示的发行方与 Marketplace 的 vendor 档案一致。"
  6. 修复项：每条写明【现象】+【根因或影响范围】，并尽量附 PingCode 单号，格式：
       <p>1、修复：<现象>（PingCode：BUG-123）</p>
     没有单号时只写现象与根因，不要编造单号，也不阻塞发版。
  7. 对外只写用户可感知的改动。构建属性、Gradle 配置、依赖升级、CI 调整这类内部改动
     不写进本文件（用户看不到、只会造成困惑），改记在 PingCode 单的"内部备注"里。
  8. 首个公开版本没有"旧行为变好"或"修了已发布的问题"，因此只写新增项。
  9. 版本号必须与 gradle.properties 的 pluginVersion 完全一致。

  骨架（复制后替换）：

  <h3>0.2.0</h3>
  <h4>新增项：</h4>
  <p>1、……</p>
  <h4>优化项：</h4>
  <p>1、……</p>
  <h4>修复项：</h4>
  <p>1、修复：……（PingCode：BUG-123）</p>
-->
<h3>&lt;版本号&gt;</h3>
<h4>新增项：</h4>
<p>1、&lt;改动对象&gt;：&lt;可观察结果&gt;</p>
<h4>优化项：</h4>
<p>1、&lt;改动对象&gt;：&lt;可观察结果&gt;</p>
<h4>修复项：</h4>
<p>1、修复：&lt;现象&gt;，原因是&lt;根因&gt;（PingCode：BUG-xxx）</p>
